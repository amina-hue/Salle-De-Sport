name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win32
          - os: macos-latest
            platform: darwin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Rebuild native modules
        run: npx electron-rebuild
        env:
          npm_config_runtime: electron
          npm_config_target: 41.0.2

      - name: Make distributables
        run: npm run make -- --platform=${{ matrix.platform }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: out/make/**/*
  create-release:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: FitManager ${{ github.ref_name }}
          body: |
            ## 🏋️ FitManager ${{ github.ref_name }}
            
            ### Téléchargements
            - **Windows** : extraire le ZIP et lancer `salle-de-sport.exe`
            - **Linux** : installer le `.deb` avec `sudo dpkg -i *.deb`
            - **macOS** : extraire le ZIP et lancer l'app
            
            ### Prérequis
            MySQL doit être installé sur la machine.
            Mot de passe root : `Fitmanager@2026`
          files: |
            darwin-build/**/*
            linux-build/**/*
            win32-build/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}